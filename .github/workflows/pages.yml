name: Deploy NeurIPS Showcase to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "production/COMP7404/NeurIPS Showcase/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # 只发布分类检索页：仅拷贝 neurips2025-oral-spotlight 子目录，其余文件不进网站
      - name: Stage site (paper explorer only)
        run: |
          mkdir -p _site
          cp -R "production/COMP7404/NeurIPS Showcase/neurips2025-oral-spotlight" "_site/neurips2025-oral-spotlight"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
